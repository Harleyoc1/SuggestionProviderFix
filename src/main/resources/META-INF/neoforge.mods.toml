modLoader="javafml"
loaderVersion="${loaderVersionRange}"
license="MIT"

[[mods]]
displayName="Suggestion Provider Fix"
modId="${modId}"
version="${modVersion}"
updateJSONURL="https://github.com/Harleyoc1/SuggestionProviderFix/blob/1.21/version_info.json?raw=true"
displayURL="https://www.curseforge.com/minecraft/mc-mods/suggestion-provider-fix"
credits=""
authors="Harley O'Connor"
description='''
A minor change to Minecraft's suggestion provider so that it auto-completes locations for all moded resources.
'''

[[mixins]]
config="${modId}.mixins.json"

[[dependencies.${modId}]]
    modId="neoforge"
    mandatory=true
    versionRange="${forgeVersionRange}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${modId}]]
    modId="minecraft"
    mandatory=true
    versionRange="${mcVersionRange}"
    ordering="NONE"
    side="BOTH"
